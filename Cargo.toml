[workspace]

[package]
name = "dekopon-wedge-kubectl"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Narrow Kubernetes operations for Dekopon, as a Wasm component"
repository = "https://github.com/dekopon-agents/dekopon-wedge-kubectl"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
dekopon-provider-sdk = "=0.64.0"
schemars = "=1.2.2"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
dekopon-provider-sdk-testkit = "=0.64.0"
serde_json = "1.0.151"
